[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "open-domain-qa"
version = "0.1.0"
description = "Open-domain question answering coursework project"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["code"]
